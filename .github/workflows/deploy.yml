name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The custom domain serves from "/"; otherwise it's /<repo>/.
      - name: Set base path and site URL
        run: |
          if [[ "${{ vars.PAGES_CUSTOM_DOMAIN }}" == "true" ]]; then
            echo "BASE_PATH=/" >> $GITHUB_ENV
            echo "SITE_URL=https://stephen.glass" >> $GITHUB_ENV
          else
            echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> $GITHUB_ENV
          fi

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
